<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Ropa - PMV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="style.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <header class="navbar navbar-expand-md navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="#">
                Tienda<span class="text-dark fw-light">MVP</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <button id="nav-catalog" class="nav-link fw-semibold btn btn-link" onclick="app.switchView('catalog')">Catálogo</button>
                    </li>
                    <li class="nav-item">
                        <button id="nav-admin" class="nav-link fw-semibold btn btn-link" onclick="app.switchView('admin')">Panel de Control</button>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <button id="cart-button" class="btn btn-link text-secondary position-relative" data-bs-toggle="offcanvas" data-bs-target="#cart-modal">
                        <i class="bi bi-cart3 fs-4"></i>
                        <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">
                            0
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow-1 container py-5">
        <section id="catalog-view" class="view-section">
            <div class="border-bottom pb-3 mb-4">
                <h2 class="fw-bolder text-dark">Nuevos Ingresos</h2>
                <p class="text-muted mb-0">Descubre nuestra última colección con estilo y elegancia.</p>
            </div>
            <div id="product-grid" class="row g-4">
            </div>
        </section>

        <section id="admin-view" class="view-section d-none">
            <div class="border-bottom pb-3 mb-4 d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-3">
                <div>
                    <h2 class="fw-bolder text-dark">Gestión de Inventario</h2>
                    <p class="text-muted mb-0">Administra los productos de tu tienda.</p>
                </div>
                <button class="btn btn-primary fw-medium shadow-sm d-flex align-items-center gap-2">
                    <i class="bi bi-plus-lg"></i>
                    Nuevo Producto
                </button>
            </div>
            <div class="card shadow-sm border-0">
                <div class="card-body p-5">
                </div>
            </div>
        </section>
    </main>

    <div id="modal-overlay" class="modal-backdrop fade d-none"></div>

    <aside id="cart-modal" class="offcanvas offcanvas-end" tabindex="-1">
        <div class="offcanvas-header bg-light border-bottom">
            <h5 class="offcanvas-title fw-bold">Tu Carrito</h5>
            <button type="button" id="close-cart" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div id="cart-items" class="offcanvas-body d-flex flex-column justify-content-center align-items-center text-muted">
            <i class="bi bi-cart-x fs-1 mb-3 text-secondary opacity-50"></i>
        </div>
        <div class="offcanvas-body border-top bg-light flex-grow-0">
            <div class="d-flex justify-content-between mb-3">
                <span class="fw-medium text-secondary">Subtotal</span>
                <span id="cart-total" class="fs-4 fw-bold text-dark">$0</span>
            </div>
            <button id="checkout-button" class="btn btn-dark w-100 py-2 fw-bold shadow-sm" onclick="app.processPayment()">
                Proceder al Pago
            </button>
        </div>
    </aside>

    <footer class="bg-white border-top mt-auto py-4">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center text-muted small">
            <p class="mb-0">&copy; 2026 Tienda MVP - PMV Integración Continua.</p>
            <p class="mb-0">Desarrollado por el grupo de trabajo 2 de Integración Continua.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
